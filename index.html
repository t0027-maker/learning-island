{title:'馬拉拉的故事',icon:'📖',pos:[23,38],type:'課文故事',paragraphs:['馬拉拉出生於巴基斯坦西北部。當地許多女孩無法接受正式教育，但她的父親是一位詩人、校長和社會運動家，支持女兒上學。','2008年，11歲的馬拉拉遇到恐怖組織控制家鄉，女孩被禁止上學，婦女也受到工作與生活上的限制。她與父親參加抗議活動、公開演講。','2009年，她在英國廣播公司（BBC）的網站記錄被控制的生活；2012年10月9日，她搭乘校車時遭到槍擊，之後被送往英國救治並存活下來。','2013年，她在聯合國演講，持續倡議教育權；2014年，17歲的她獲得諾貝爾和平獎。'],tip:'課文核心：真正的勇敢，不是從來不害怕，而是即使害怕，仍願意為信念前進。',questions:[['馬拉拉的父親支持她做什麼？',['放棄讀書','接受教育','停止發聲'],1],['馬拉拉在哪一年遭到槍擊？',['2009年','2012年','2014年'],1],['馬拉拉得到哪一個國際獎項？',['諾貝爾和平獎','奧斯卡獎','奧運金牌'],0]]},
{title:'塔利班的起源',icon:'📜',pos:[45,32],type:'歷史補充',paragraphs:['「塔利班」這個名稱與「學生」有關。阿富汗塔利班在1990年代的戰亂背景中興起，1996年首次掌權。','課文提到的2008年家鄉遭控制，以及2012年對馬拉拉的襲擊，涉及的是在巴基斯坦活動的武裝組織。','宗教不等於恐怖主義，穆斯林也不等於恐怖分子。應依據具體行為認識暴力極端組織，不能以宗教身分概括所有人。'],tip:'補充提醒：阿富汗塔利班與巴基斯坦塔利班（TTP）不是同一個組織。',questions:[['阿富汗塔利班主要在什麼年代興起？',['1990年代','1950年代','2020年代'],0],['下列哪一項說法正確？',['所有穆斯林都是恐怖分子','宗教不等於恐怖主義','所有塔利班組織完全相同'],1]]},
{title:'歷史時間軸',icon:'⏰',pos:[68,34],type:'事件排序',paragraphs:['1996年：阿富汗塔利班首次掌權。','2007年：巴基斯坦塔利班（TTP）成立。','2008年：課文記述馬拉拉的家鄉遭到武裝組織控制。','2009年：馬拉拉透過BBC網站記錄生活。','2012年：馬拉拉在校車上遭槍擊。','2013年：馬拉拉在聯合國演講。','2014年：馬拉拉獲得諾貝爾和平獎。','2021年：阿富汗塔利班重新掌權。'],tip:'課文的敘事順序以馬拉拉成長、遭遇、康復後的行動為主軸。',questions:[['馬拉拉透過BBC網站記錄生活是哪一年？',['2009年','2013年','2021年'],0],['下列哪個事件發生最晚？',['2008年家鄉遭控制','2012年遭槍擊','2014年獲得和平獎'],2]]},
{title:'兩個塔利班與字詞',icon:'🪧',pos:[25,70],type:'字詞句練習',paragraphs:['阿富汗塔利班主要在阿富汗活動；巴基斯坦塔利班（TTP）主要在巴基斯坦活動。課文中襲擊馬拉拉的是巴基斯坦塔利班。','課本重要詞語：霸占、組織、恐怖、控制、廣播、受教權、攻擊、威脅、恐懼、震撼、康復。','形近字：組／祖／租；改／攻；復／複／腹。注意字形與意思，例如「攻擊」不能寫成「改擊」，「康復」不能寫成「康複」。'],tip:'詞義提醒：「震撼」指受到強烈衝擊；「不可思議」表示難以想像或理解。',questions:[['2012年襲擊馬拉拉的是哪個組織？',['巴基斯坦塔利班（TTP）','聯合國','學校老師'],0],['下列哪個詞語寫法正確？',['康複','康復','康腹'],1],['下列哪個詞語表示「受到強烈衝擊」？',['震撼','租借','廣播'],0]]},
{title:'句型與語文加油站',icon:'🌎',pos:[61,71],type:'語文練習',paragraphs:['課本句型「不但……反而……」：用來表示結果與原本預期不同。例如：她不但沒有放棄，反而更加努力。','「縱使……卻……」：表示即使有困難，結果仍與阻礙相反。例如：縱使心中害怕，她卻仍願意為信念前進。','「因此……」：表示因果關係。閱讀時可找出事情的原因和結果。','成語「權宜之計」：為應付某種情況而暫時採取的辦法；「屢長久之計」不是課本詞語，使用時應分辨。'],tip:'小技巧：先判斷句子要表達「轉折」還是「因果」，再選擇適合的連接詞。',questions:[['「縱使……卻……」主要表達哪種關係？',['轉折','並列','列舉'],0],['「權宜之計」是什麼意思？',['暫時應付情況的辦法','永遠不變的規定','隨意猜測的想法'],0],['「她不但沒有放棄，＿＿更加努力。」應填入？',['因此','反而','或者'],1]]},
{title:'和平知識終極挑戰',icon:'🏆',pos:[83,66],type:'閱讀思辨',paragraphs:['課文末段提出問題：沒有恐懼、不害怕，就是勇敢嗎？作者認為不知道害怕，有時可能是無知；馬拉拉雖然害怕，卻仍為信念前進。','馬拉拉和父親成立馬拉拉基金會，協助女孩接受教育。每年7月12日是「馬拉拉日」。','截至2026年，阿富汗女孩接受中等教育仍受到限制。這是課外現況補充，不是原課文的事件。','請想一想：我們能用什麼和平、安全的方法，為受到不公平對待的人發聲？'],tip:'通關信念：尊重差異、拒絕暴力、珍惜教育，用知識與同理心改變世界。',questions:[['作者認為「真正的勇敢」是什麼？',['完全不知道危險','即使害怕仍願意為信念前進','只要贏得比賽'],1],['每年哪一天是馬拉拉日？',['7月12日','10月9日','12月25日'],0],['遇到不公平時，哪種方式最符合和平精神？',['用暴力威脅別人','保持沉默不管','尋求協助並以和平方式表達'],2]]}

const key='malala_island_v3';let completed=0;try{completed=Math.max(0,Math.min(6,Number(localStorage.getItem(key)||0)))}catch(e){}let active=-1,answers={},checked=false;const $=id=>document.getElementById(id);const positions=lessons.map(x=>x.pos);
function save(){try{localStorage.setItem(key,String(completed))}catch(e){}}
function renderMap(){const root=$('spots');root.innerHTML='';lessons.forEach((l,i)=>{let b=document.createElement('button');b.className='spot '+(i<completed?'complete':i===completed?'active':'locked');b.style.left=l.pos[0]+'%';b.style.top=l.pos[1]+'%';b.setAttribute('aria-label',`第${i+1}關 ${l.title} ${i>completed?'尚未解鎖':''}`);b.title=`第${i+1}關：${l.title}`;b.innerHTML=`<span>${i<completed?'✅':i>completed?'🔒':l.icon}</span>`;b.onclick=()=>i<=completed?openLesson(i):lockedNotice(i);root.appendChild(b)});$('counter').textContent=`⭐ ${completed} / 6`;$('status').textContent=completed===6?'🏆 全部通關':`🔓 第 ${completed+1} 關已開啟`;$('bar').style.width=completed/6*100+'%'}
function lockedNotice(i){alert(`🔒 請先完成第 ${completed+1} 關，才能挑戰第 ${i+1} 關！`)}
function openLesson(i){active=i;answers={};checked=false;const l=lessons[i];$('chapter').textContent=`第 ${i+1} 關 · ${l.type}`;$('panelTitle').textContent=l.icon+' '+l.title;const story=l.paragraphs.map(p=>`<p>${escapeHtml(p)}</p>`).join('');$('panelBody').innerHTML=`<div class="story">${story}</div><div class="callout">💡 ${escapeHtml(l.tip)}</div><div class="qhead">🎯 知識挑戰 · ${l.questions.length} 題全對才能過關</div><div id="quiz"></div><div class="actions"><button class="btn secondary" onclick="closePanel()">↩ 返回島嶼</button><button class="btn" id="submit" onclick="submitQuiz()">送出答案 ✨</button></div>`;renderQuiz();$('overlay').classList.add('show');document.body.style.overflow='hidden'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderQuiz(){const l=lessons[active];$('quiz').innerHTML=l.questions.map((q,qi)=>`<div class="question"><strong>${qi+1}. ${escapeHtml(q[0])}</strong><div class="answers">${q[1].map((v,j)=>`<button class="choice ${answers[qi]===j?'selected':''} ${checked&&answers[qi]===j?(j===q[2]?'correct':'wrong'):''}" onclick="choose(${qi},${j})">${'ABC'[j]}. ${escapeHtml(v)}</button>`).join('')}</div>${checked&&answers[qi]!==q[2]?'<p class="feedback bad">再試一次，回到上方教材找找線索！</p>':checked?'<p class="feedback good">答對了！</p>':''}</div>`).join('')}
function choose(q,j){if(checked){checked=false}answers[q]=j;renderQuiz()}
function submitQuiz(){let l=lessons[active];if(l.questions.some((q,i)=>answers[i]===undefined)){alert('請先回答所有題目喔！');return}checked=true;renderQuiz();let right=l.questions.every((q,i)=>answers[i]===q[2]);if(!right){$('quiz').scrollIntoView({behavior:'smooth',block:'start'});return}let old=completed;if(active===completed){completed++;save()}renderMap();confetti();if(completed===6){showFinish();return}const next=active+1;$('panelBody').innerHTML=`<div class="celebrate"><div class="trophy">🌟</div><h2>闖關成功！</h2><p>你完成了「${escapeHtml(l.title)}」！</p><p><span class="badge">⭐ 獲得一顆勇氣星星</span></p><p>目前進度：${completed} / 6 關</p><div class="actions" style="justify-content:center"><button class="btn secondary" onclick="closePanel()">🗺️ 返回島嶼</button><button class="btn" onclick="openLesson(${next})">前往下一關 ➜</button></div></div>`}
function showFinish(){$('chapter').textContent='勇氣與和平探索島 · 完成';$('panelTitle').textContent='🏆 探索家通關證書';$('panelBody').innerHTML=`<div class="celebrate"><div class="trophy">🏆</div><h2>恭喜！六關全數通過</h2><div class="certificate"><h3>🌈 勇氣與和平探索家 🌈</h3><p>你已完成〈最勇敢的女孩〉六大探索任務，<br>認識馬拉拉的勇氣、教育的價值與和平的力量。</p><strong>⭐⭐⭐⭐⭐⭐</strong></div><div class="actions" style="justify-content:center"><button class="btn secondary" onclick="closePanel()">返回美麗的島嶼</button><button class="btn" onclick="window.print()">🖨️ 列印證書</button></div></div>`}
function confetti(){for(let i=0;i<32;i++){let s=document.createElement('span');s.className='sparkle';s.textContent=['⭐','✨','🌟','🎉','💛'][i%5];s.style.left=Math.random()*100+'vw';s.style.top='-40px';s.style.animationDelay=Math.random()*.7+'s';s.style.animationDuration=(1.3+Math.random()*1.2)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3000)}}
function closePanel(){$('overlay').classList.remove('show');document.body.style.overflow='';active=-1}
$('close').onclick=closePanel;$('overlay').onclick=e=>{if(e.target===$('overlay'))closePanel()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});$('reset').onclick=()=>{if(confirm('確定要清除所有通關進度，重新從第一關開始嗎？')){completed=0;save();renderMap();closePanel()}};$('help').onclick=()=>{alert('🏝️ 探索指南\n\n① 點選島上發光的關卡\n② 閱讀故事與課文重點\n③ 完成每一關的所有題目\n④ 全部答對獲得一顆星星，解鎖下一關\n⑤ 收集六顆星星，獲得通關證書！\n\n進度會儲存在目前瀏覽器。')};renderMap();
